document_identity:
  id_field: _id
  description: Every document in a collection is keyed by a string `_id`. Writes use upsert semantics keyed on `_id`, so re-sending a document with the same `_id` replaces it (data-level idempotency).
write_semantics:
  operations:
  - upsert
  - update
  - delete
  idempotent_by_id: true
  note: Upsert is idempotent on `_id`. No request-level Idempotency-Key header is documented.
query:
  language: sql
  description: Hybrid, multi-vector, keyword (BM25), dense-vector, and sparse-vector queries plus metadata filtering are expressed in a single query; SQL is supported as the query language and any PostgreSQL client can connect over the Postgres wire protocol.
  top_k: Result count is controlled by a top-k / limit parameter (CLI --top-k, default 10).
retries:
