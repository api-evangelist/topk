aid: topk
name: Topk
description: >-
  TopK is a search engine for accuracy-critical AI applications, delivering hybrid search,
  multi-vector (late-interaction) retrieval, dense and sparse vector search, BM25 keyword
  search, custom ranking, document parsing, and grounded question answering through a single
  API. Built on object storage for roughly 10x lower cost and effectively unlimited scale,
  TopK exposes a Collection API for structured document storage and querying, a Dataset API
  for unstructured document ingestion, semantic search, and evidence-backed answers, and a
  Management API for datasets and collections. It ships official Python, JavaScript, Rust, and
  SQL (PostgreSQL-wire) SDKs, a Homebrew-installable CLI, and a hosted MCP server so AI agents
  can query private data with natural language. TopK is developed by topk-io and is a portfolio
  company of Earlybird.
