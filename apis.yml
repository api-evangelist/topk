apis:
- aid: topk:collection-api
  name: TopK Collection API
  description: >-
    Structured document store and query surface. Create collections with typed, indexed fields
    (keyword_index, semantic_index, vector index), upsert/update/delete documents by `_id`, and
    run hybrid queries that combine dense vector, multi-vector, sparse vector, BM25 keyword
    search, and metadata filtering in a single request.
  humanURL: https://docs.topk.io/collections/query
